name: Validate P0 package

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest
      - run: python tools/validate_package.py
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npx --yes luaparse -q packages/kanto_rework_core/main.lua
      - run: |
          find packages/kanto_rework_core/core -name '*.lua' -print0 \
            | xargs -0 -n1 npx --yes luaparse -q
      - run: python tools/build_core.py
      - uses: actions/upload-artifact@v4
        with:
          name: kanto-rework-core-p0
          path: dist/kanto_rework_core-*.zip
          if-no-files-found: error
