name: Publish Kanto Rework Core

on:
  push:
    tags:
      - 'kanto_rework_core-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and build
        run: |
          python tools/validate_package.py
          python tools/build_core.py
      - name: Resolve version
        id: package
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib
          manifest = json.loads(pathlib.Path('packages/kanto_rework_core/manifest.json').read_text())
          print(f"version={manifest['version']}")
          print(f"archive=kanto_rework_core-{manifest['version']}.zip")
          PY
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          test "$GITHUB_REF_NAME" = "kanto_rework_core-v${{ steps.package.outputs.version }}"
      - name: Publish GitHub release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="kanto_rework_core-v${{ steps.package.outputs.version }}"
          ARCHIVE="dist/${{ steps.package.outputs.archive }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ARCHIVE" --clobber
          else
            gh release create "$TAG" "$ARCHIVE" \
              --title "Kanto Rework Core v${{ steps.package.outputs.version }}" \
              --notes "Experimental P0 technical-spike build."
          fi
