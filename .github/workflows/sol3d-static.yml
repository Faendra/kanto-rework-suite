name: Sol 3DWorld gates

on:
  push:
    branches:
      - experiment/sol-3dworld-hd2d
    paths:
      - 'packages/kanto_rework_3dworld_hd2d/**'
      - 'tests/sol3d_mod_loader_test.lua'
      - '.github/workflows/sol3d-static.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    name: Lua syntax + manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout KRS
        uses: actions/checkout@v4

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1

      - name: Compile-check Lua sources
        shell: bash
        run: |
          set -euo pipefail
          find packages/kanto_rework_3dworld_hd2d -type f -name '*.lua' -print0 \
            | sort -z \
            | xargs -0 -n1 luac5.1 -p

      - name: Validate manifest JSON
        run: python3 -m json.tool packages/kanto_rework_3dworld_hd2d/manifest.json >/dev/null

  gen1recomp-loader:
    name: Gen1Recomp v0.2.32 loader
    runs-on: ubuntu-latest
    steps:
      - name: Checkout KRS
        uses: actions/checkout@v4

      - name: Install LuaJIT
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit

      - name: Checkout Gen1Recomp v0.2.32
        run: |
          git clone --depth 1 --branch v0.2.32 \
            https://github.com/bryanthaboi/gen1recomp.git /tmp/gen1recomp

      - name: Load KRS through official mod loader
        shell: bash
        run: |
          set -o pipefail
          cd /tmp/gen1recomp
          KRS_PACKAGE_DIR="$GITHUB_WORKSPACE/packages/kanto_rework_3dworld_hd2d" \
            luajit "$GITHUB_WORKSPACE/tests/sol3d_mod_loader_test.lua" \
            2>&1 | tee "$GITHUB_WORKSPACE/sol3d-loader.log"

      - name: Upload loader diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sol3d-loader-diagnostic
          path: sol3d-loader.log
          if-no-files-found: error
          retention-days: 7
